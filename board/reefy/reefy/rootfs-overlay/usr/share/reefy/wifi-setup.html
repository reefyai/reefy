<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reefy Wi-Fi setup</title>
<style>body{font:16px system-ui;max-width:400px;margin:48px auto;padding:20px;color:#14332e}label,select,input,button{display:block;box-sizing:border-box;width:100%;margin:12px 0}input,select,button{padding:12px;font:inherit}button{background:#146757;color:white;border:0;border-radius:6px}</style>
<h1>Connect Reefy to Wi-Fi</h1><form id="setup" method="post" action="/connect"><input type="hidden" name="token" value="${token}"><label>Network<select id="networks"><option value="">Enter network name</option>${network_options}</select></label><label>Network name<input id="ssid" name="ssid" required maxlength="32" autocomplete="off"></label><label>Password<input id="password" name="password" type="password" required minlength="8" autocomplete="new-password"></label><button>Connect</button></form>
<form method="post" action="/refresh"><input type="hidden" name="token" value="${token}"><button type="submit">Scan again</button></form>
<script>document.querySelector('#networks').onchange=function(){document.querySelector('#ssid').value=this.value}</script></html>
