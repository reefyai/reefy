[Unit]
Wants=reefy-storage-guard.service reefy-storage-watchdog.service reefy-storage-images.service
After=reefy-storage-guard.service reefy-storage-watchdog.service

[Service]
Environment=PYTHONPATH=/usr/lib/reefy
# This gate fails closed only after an explicit quota policy arrives. Legacy
# cached configurations may still boot while waiting for their first policy.
ExecStartPre=/usr/bin/python3 -m reefy.storage_service boot
ExecStart=
ExecStart=/usr/bin/dockerd -H fd:// --containerd=/run/containerd/containerd.sock --config-file=/run/reefy/storage-pressure/docker.json
TimeoutStartSec=1800
