[Unit]
# Bound service shutdown while PID 1 is still feeding RuntimeWatchdogSec.
# If graceful shutdown stalls, force termination and enter final shutdown;
# RebootWatchdogSec protects that later phase on supported hardware.
# A timed-out poweroff intentionally falls back to reboot for recoverability.
JobTimeoutSec=120s
JobTimeoutAction=reboot-force
