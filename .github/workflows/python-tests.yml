name: reefy python unit tests

# Fast, host-only checks for the reefy device-agent package. Runs on
# ubuntu-latest (no self-hosted firmware runner): syntax, the paho
# isolation property, and the stdlib-unittest suite. The full
# behavioural gate is the e2e suite in reefy-service.
on:
  push:
    branches: [main]
    paths:
      - 'board/reefy/reefy/rootfs-overlay/usr/lib/reefy/**'
      - 'board/reefy/reefy/rootfs-overlay/usr/bin/reefy-control'
      - 'board/reefy/reefy/rootfs-overlay/usr/bin/reefy-reconciler'
      - 'board/reefy/reefy/rootfs-overlay/usr/bin/reefy-mount-volumes'
      - 'board/reefy/reefy/rootfs-overlay/usr/bin/reefy-backup'
      - 'board/reefy/reefy/rootfs-overlay/usr/bin/boot-reefy-init.sh'
      - 'board/reefy/reefy/rootfs-overlay/usr/bin/reefy-wifi-early'
      - 'board/reefy/reefy/rootfs-overlay/usr/share/varlink/**'
      - 'board/reefy/reefy/tests/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - '.github/workflows/python-tests.yml'
      - 'board/reefy/reefy/rootfs-overlay/usr/lib/reefy/**'
      - 'board/reefy/reefy/rootfs-overlay/usr/bin/reefy-backup'
      - 'board/reefy/reefy/rootfs-overlay/usr/bin/boot-reefy-init.sh'
      - 'board/reefy/reefy/rootfs-overlay/usr/bin/reefy-wifi-early'
      - 'board/reefy/reefy/rootfs-overlay/usr/share/varlink/**'
      - 'board/reefy/reefy/tests/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || (github.head_ref && format('refs/heads/{0}', github.head_ref)) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

jobs:
  unit:
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","big-bird"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: py_compile package + entry scripts
        run: |
          ov=board/reefy/reefy/rootfs-overlay/usr/lib/reefy
          bin=board/reefy/reefy/rootfs-overlay/usr/bin
          python -m py_compile \
            "$ov/reefy/__init__.py" "$ov/reefy/shared.py" "$ov/reefy/storage.py" \
            "$ov/reefy/dataplane.py" "$ov/reefy/control.py" \
            "$bin/reefy-control" "$bin/reefy-reconciler" "$bin/reefy-mount-volumes" \
            "$bin/reefy-backup"

      - name: paho isolation (data-plane/boot-mount/shared import without paho)
        # paho-mqtt is deliberately NOT installed here: storage, dataplane
        # and shared must import cleanly so the data-plane and boot-mount
        # processes never need it. Only reefy.control may require paho.
        run: |
          ov=board/reefy/reefy/rootfs-overlay/usr/lib/reefy
          python -c "import sys; sys.path.insert(0,'$ov'); import reefy.shared, reefy.storage, reefy.dataplane; print('paho-free import OK')"

      - name: unit tests
        run: |
          sudo apt-get update
          sudo apt-get install -y parted gdisk
          pip install varlink==31.0.0 pytest
          python -m unittest discover -s board/reefy/reefy/tests -v

      - name: Artifact and startup concurrency regressions
        run: |
          pip install pytest
          python -m pytest -q board/reefy/reefy/tests/test_artifacts.py board/reefy/reefy/tests/test_startup_readiness.py board/reefy/reefy/tests/test_startup_timing.py

      - name: MQTT socket ownership with real Paho
        # Run after the dependency-free import checks above.
        run: |
          pip install paho-mqtt==2.1.0
          python -m unittest discover -s board/reefy/reefy/tests -p test_mqtt_network_loop.py -v
